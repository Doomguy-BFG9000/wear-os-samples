name: WatchFaceFormat

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'WatchFaceFormat/**'
      - '.github/workflows/WatchFaceFormat.yml'
  pull_request:
    paths:
      - 'WatchFaceFormat/**'
      - '.github/workflows/WatchFaceFormat.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample:
          - Complications
          - Flavors
          - PhotosMask
          - PhotosMulti
          - SimpleAnalog
          - SimpleDigital
          - Weather

    env:
      SAMPLE_PATH: WatchFaceFormat/${{ matrix.sample }}

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Generate cache key
        run: ./scripts/checksum.sh $SAMPLE_PATH checksum.txt

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-*
            ~/.gradle/caches/jars-*
            ~/.gradle/caches/build-cache-*
          key: gradle-${{ matrix.sample }}-${{ hashFiles('checksum.txt') }}

      - name: Build project
        working-directory: ${{ env.SAMPLE_PATH }}
        run: ./gradlew check --stacktrace

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-reports-${{ matrix.sample }}
          path: ${{ env.SAMPLE_PATH }}/**/build/reports
